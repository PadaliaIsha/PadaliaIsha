name: Generate Snake

on:
  schedule: 
    # execute every 6 hours
    - cron: "* */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Jobs to update snake
    runs-on: ubuntu-latest
    
    steps:
      # Snake Animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PadaliaIsha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6366F1&color_dots=#EBEDF0,#C7D2FE,#A5B4FC,#818CF8,#4F46E5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#1E1B4B,#3730A3,#6366F1,#A5B4FC

      # Push the changes
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}

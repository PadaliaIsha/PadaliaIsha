<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" role="img" aria-label="NubX: Gold-Backed Stablecoin Platform. Gold-backed stablecoin with mint/burn controllers, custodian integration, hot/cold wallet clusters, real-time settlement, and KYC/AML.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <clipPath id="card"><rect width="420" height="310" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .title { fill: #F8FAFC; font-size: 24px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { fill: #A5B4FC; font-size: 14px; font-weight: 500; }
    .desc { fill: #CBD5E1; font-size: 15px; }
    .tag { fill: #C7D2FE; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .item { fill: #CBD5E1; font-size: 15px; }
    .item .name { fill: #F8FAFC; font-weight: 700; }
    .link { fill: #A5B4FC; font-size: 14px; font-weight: 600; }
    .up { opacity: 0; animation: up 0.7s ease-out forwards; }
    .accent { animation: flow 6s linear infinite; }
    .glow { animation: breathe 5s ease-in-out infinite; }
    .orbit { transform-origin: 52px 52px; animation: spin 6s linear infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-420px); } }
    @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="420" height="310" fill="url(#bg)"/>
    <rect class="glow" width="420" height="310" fill="url(#glow)"/>
    <g class="accent"><rect width="840" height="3" fill="url(#accent)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="419" height="309" rx="14" fill="none" stroke="#1F2A44"/>
  <rect x="24" y="24" width="56" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#334155"/>
  <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs>
    <circle cx="52" cy="52" r="19" fill="url(#gold)"/>
    <circle cx="52" cy="52" r="14.5" fill="none" stroke="#FFFBEB" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="52" y="58.5" text-anchor="middle" fill="#78350F" font-size="17" font-weight="800">N</text>
  <g class="up" style="animation-delay:0.1s">
    <text class="title" x="96" y="49">NubX</text>
    <text class="sub" x="96" y="72">Gold-Backed Stablecoin Platform</text>
  </g>
  <g class="up" style="animation-delay:0.3s">
    <text class="desc" x="24" y="118">Gold-backed stablecoin with mint/burn</text>
    <text class="desc" x="24" y="141">controllers, custodian integration, hot/cold</text>
    <text class="desc" x="24" y="164">wallet clusters, real-time settlement, and</text>
    <text class="desc" x="24" y="187">KYC/AML.</text>
  </g>
  <g class="up" style="animation-delay:0.5s">
    <rect x="24" y="214" width="81" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="64.5" y="231.5" text-anchor="middle">Solidity</text>
    <rect x="113" y="214" width="73" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="149.5" y="231.5" text-anchor="middle">Node.js</text>
    <rect x="194" y="214" width="119" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="253.5" y="231.5" text-anchor="middle">Microservices</text>
    <rect x="321" y="214" width="73" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="357.5" y="231.5" text-anchor="middle">Wallets</text>
    <rect x="24" y="248" width="73" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="60.5" y="265.5" text-anchor="middle">KYC/AML</text>
  </g>

</svg>

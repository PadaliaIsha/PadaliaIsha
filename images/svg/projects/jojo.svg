<svg xmlns="http://www.w3.org/2000/svg" width="495" height="250" viewBox="0 0 495 250" role="img" aria-label="JOJO: Gujarati OTT Platform. Gujarati OTT entertainment platform for streaming movies, web series, shows, Natak, documentaries, and music, with a scalable streaming-ready backend and content delivery.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D4A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="495" height="250" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Arial, Helvetica, sans-serif; }
    .emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: 22px; }
    .title { fill: #F8FAFC; font-size: 22px; font-weight: 700; }
    .sub { fill: #99F6E4; font-size: 13px; font-style: italic; }
    .desc { fill: #CCFBF1; font-size: 13.5px; }
    .tag { fill: #E0FFFA; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .item { fill: #CCFBF1; font-size: 13.5px; }
    .item tspan.name { fill: #FFFFFF; font-weight: 700; }
    .link { fill: #5EEAD4; font-size: 13px; font-weight: 600; }
    .up { opacity: 0; animation: up 0.7s ease-out forwards; }
    .ring { transform-origin: 40px 48px; animation: ring 2.4s ease-out infinite; }
    .bar { animation: bar 4s linear infinite; }
    .shine { animation: shine 7s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes bar { from { transform: translateX(0); } to { transform: translateX(-495px); } }
    @keyframes shine { 0% { transform: translateX(-200px); } 50%, 100% { transform: translateX(695px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="495" height="250" fill="url(#bg)"/>
    <g class="bar"><rect width="990" height="4" fill="url(#bar)"/></g>
    <rect class="shine" x="0" y="0" width="160" height="250" fill="url(#shine)"/>
  </g>
  <circle class="ring" cx="40" cy="48" r="22" fill="none" stroke="#5EEAD4" stroke-width="2"/>
  <circle cx="40" cy="48" r="22" fill="#5EEAD4" fill-opacity="0.18" stroke="#5EEAD4" stroke-opacity="0.6"/>
  <text class="emoji" x="40" y="56" text-anchor="middle">🎬</text>
  <g class="up" style="animation-delay:0.1s">
    <text class="title" x="76" y="46">JOJO</text>
    <text class="sub" x="76" y="66">Gujarati OTT Platform</text>
  </g>
  <g class="up" style="animation-delay:0.3s">
    <text class="desc" x="22" y="104">Gujarati OTT entertainment platform for streaming movies, web</text>
    <text class="desc" x="22" y="124">series, shows, Natak, documentaries, and music, with a scalable</text>
    <text class="desc" x="22" y="144">streaming-ready backend and content delivery.</text>
  </g>
  <g class="up" style="animation-delay:0.5s">
    <rect x="22" y="186" width="37" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="tag" x="40.5" y="201" text-anchor="middle">OTT</text>
    <rect x="67" y="186" width="65" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="tag" x="99.5" y="201" text-anchor="middle">Node.js</text>
    <rect x="140" y="186" width="51" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="tag" x="165.5" y="201" text-anchor="middle">React</text>
    <rect x="199" y="186" width="79" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="tag" x="238.5" y="201" text-anchor="middle">Streaming</text>
    <rect x="286" y="186" width="128" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="tag" x="350" y="201" text-anchor="middle">Content Platform</text>
  </g>
  <g class="up" style="animation-delay:0.7s"><text class="link" x="473" y="234" text-anchor="end">jojoapp.in ↗</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" role="img" aria-label="JOJO: Gujarati OTT Platform. Gujarati OTT platform for streaming movies, web series, shows, Natak, documentaries, and music, built on a scalable streaming-ready backend.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <clipPath id="card"><rect width="420" height="310" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .title { fill: #F8FAFC; font-size: 24px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { fill: #A5B4FC; font-size: 14px; font-weight: 500; }
    .desc { fill: #CBD5E1; font-size: 15px; }
    .tag { fill: #C7D2FE; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .item { fill: #CBD5E1; font-size: 15px; }
    .item .name { fill: #F8FAFC; font-weight: 700; }
    .link { fill: #A5B4FC; font-size: 14px; font-weight: 600; }
    .up { opacity: 0; animation: up 0.7s ease-out forwards; }
    .accent { animation: flow 6s linear infinite; }
    .glow { animation: breathe 5s ease-in-out infinite; }
    .orbit { transform-origin: 52px 52px; animation: spin 6s linear infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-420px); } }
    @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="420" height="310" fill="url(#bg)"/>
    <rect class="glow" width="420" height="310" fill="url(#glow)"/>
    <g class="accent"><rect width="840" height="3" fill="url(#accent)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="419" height="309" rx="14" fill="none" stroke="#1F2A44"/>
  <rect x="24" y="24" width="56" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#334155"/>
  <circle cx="52" cy="52" r="19" fill="#F37021"/>
    <path d="M47 43.5 L61 52 L47 60.5 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <g class="up" style="animation-delay:0.1s">
    <text class="title" x="96" y="49">JOJO</text>
    <text class="sub" x="96" y="72">Gujarati OTT Platform</text>
  </g>
  <g class="up" style="animation-delay:0.3s">
    <text class="desc" x="24" y="118">Gujarati OTT platform for streaming movies, web</text>
    <text class="desc" x="24" y="141">series, shows, Natak, documentaries, and music,</text>
    <text class="desc" x="24" y="164">built on a scalable streaming-ready backend.</text>
  </g>
  <g class="up" style="animation-delay:0.5s">
    <rect x="24" y="214" width="43" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="45.5" y="231.5" text-anchor="middle">OTT</text>
    <rect x="75" y="214" width="73" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="111.5" y="231.5" text-anchor="middle">Node.js</text>
    <rect x="156" y="214" width="58" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="185" y="231.5" text-anchor="middle">React</text>
    <rect x="222" y="214" width="88" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="266" y="231.5" text-anchor="middle">Streaming</text>
    <rect x="24" y="248" width="142" height="26" rx="13" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
    <text class="tag" x="95" y="265.5" text-anchor="middle">Content Platform</text>
  </g>
  <g class="up" style="animation-delay:0.7s"><text class="link" x="396" y="290" text-anchor="end">jojoapp.in →</text></g>
</svg>
